<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 150"
     width="100%"
     height="100%"
     role="img"
     aria-labelledby="title description">

  <title id="title">KronosGuy Brand Statement</title>
  <desc id="description">Time. Data. Workforce. Optimized.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;display=swap');

      .statement {
        font-family: 'Montserrat', Arial, sans-serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .core {
        fill: #ffffff;
      }

      .optimized {
        fill: #2ecc71;
      }
    </style>

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#ffffff"
            stroke-width="1"
            opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Strategic dark background -->
  <rect width="500"
        height="150"
        rx="8"
        fill="#34495e"/>

  <!-- Subtle atmospheric grid -->
  <rect width="500"
        height="150"
        rx="8"
        fill="url(#grid)"/>

  <!-- Bottom-right geometric accent -->
  <polygon points="450,150 500,100 500,150"
           fill="#2ecc71"/>

  <!-- Brand statement -->
  <text x="250"
        y="84"
        text-anchor="middle"
        class="statement">
    <tspan class="core">TIME. DATA. WORKFORCE. </tspan>
    <tspan class="optimized">OPTIMIZED.</tspan>
  </text>

  <!-- Green underline accent -->
  <line x1="177"
        y1="103"
        x2="323"
        y2="103"
        stroke="#2ecc71"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>
